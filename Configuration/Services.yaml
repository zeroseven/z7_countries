services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Zeroseven\Countries\:
    resource: '../Classes/*'
    exclude: '../Classes/Xclass/*'

  # Replaces the core service, so that country-aware site entities are created.
  # See \Zeroseven\Countries\Xclass\SiteConfiguration for details.
  TYPO3\CMS\Core\Configuration\SiteConfiguration:
    class: Zeroseven\Countries\Xclass\SiteConfiguration
    public: true

  Zeroseven\Countries\Event\Listener\AlterTableDefinitionStatementsEvent:
    tags:
      - name: event.listener
        identifier: 'z7_country/add-fields'
        event: TYPO3\CMS\Core\Database\Event\AlterTableDefinitionStatementsEvent
  Zeroseven\Countries\Event\Listener\ModifyHrefLangTagsEvent:
    tags:
      - name: event.listener
        identifier: 'z7_country/hreflang'
        after: 'typo3-seo/hreflangGenerator'
        event: TYPO3\CMS\Frontend\Event\ModifyHrefLangTagsEvent
  Zeroseven\Countries\Event\Listener\AfterFormEnginePageInitializedEvent:
    tags:
      - name: event.listener
        identifier: 'z7_country/form-engine'
        method: 'checkCountryAndLanguageSettings'
        event: TYPO3\CMS\Backend\Controller\Event\AfterFormEnginePageInitializedEvent
  Zeroseven\Countries\Event\Listener\AfterTcaCompilationEvent:
    tags:
      - name: event.listener
        identifier: 'z7_country/modify-tca'
        event: TYPO3\CMS\Core\Configuration\Event\AfterTcaCompilationEvent
  Zeroseven\Countries\Event\Listener\ModifyRecordListHeaderColumnsEvent:
    tags:
      - name: event.listener
        identifier: 'z7_country/modify-record-list-header'
        event: TYPO3\CMS\Backend\RecordList\Event\ModifyRecordListHeaderColumnsEvent
  Zeroseven\Countries\Event\Listener\ModifyDatabaseQueryForRecordListingEvent:
    tags:
      - name: event.listener
        identifier: 'z7_country/modify-record-list-query'
        event: TYPO3\CMS\Backend\View\Event\ModifyDatabaseQueryForRecordListingEvent
  Zeroseven\Countries\Event\Listener\ModifyButtonBarEvent:
    tags:
      - name: event.listener
        identifier: 'z7_country/modify-button-bar'
        event: TYPO3\CMS\Backend\Template\Components\ModifyButtonBarEvent
  Zeroseven\Countries\Event\Listener\ModifyInlineElementControlsEvent:
    tags:
      - name: event.listener
        identifier: 'z7_country/modify-inline-element-controls'
        event: TYPO3\CMS\Backend\Form\Event\ModifyInlineElementControlsEvent
